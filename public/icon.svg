<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background squircle -->
  <rect width="512" height="512" rx="100" fill="url(#grad1)" />
  
  <!-- Classic aSc Style Gold Bell with Schedule Grid -->
  <g transform="translate(64, 48)">
    <!-- Bell top handle -->
    <ellipse cx="192" cy="70" rx="36" ry="24" fill="#fbbf24" stroke="#92400e" stroke-width="12" />
    <!-- Bell dome -->
    <path d="M 100 240 C 100 120, 284 120, 284 240 C 310 260, 330 280, 340 310 L 44 310 C 54 280, 74 260, 100 240 Z" fill="url(#goldGrad)" stroke="#78350f" stroke-width="12" />
    <!-- Bell bottom rim -->
    <rect x="30" y="310" width="324" height="34" rx="17" fill="#f59e0b" stroke="#78350f" stroke-width="10" />
    <!-- Clapper -->
    <circle cx="192" cy="355" r="28" fill="#d97706" stroke="#78350f" stroke-width="8" />
    
    <!-- Mini Schedule Grid overlay inside bell -->
    <g transform="translate(100, 170) scale(0.75)" opacity="0.95">
      <rect x="0" y="0" width="240" height="150" rx="10" fill="#ffffff" stroke="#1e3a8a" stroke-width="6"/>
      <!-- Header row -->
      <rect x="0" y="0" width="240" height="35" rx="8" fill="#2563eb"/>
      <line x1="60" y1="0" x2="60" y2="150" stroke="#94a3b8" stroke-width="4"/>
      <line x1="120" y1="0" x2="120" y2="150" stroke="#94a3b8" stroke-width="4"/>
      <line x1="180" y1="0" x2="180" y2="150" stroke="#94a3b8" stroke-width="4"/>
      <line x1="0" y1="75" x2="240" y2="75" stroke="#94a3b8" stroke-width="4"/>
      <line x1="0" y1="112" x2="240" y2="112" stroke="#94a3b8" stroke-width="4"/>
      <!-- Subject lesson color cards in timetable -->
      <rect x="64" y="40" width="52" height="30" rx="4" fill="#ef4444"/>
      <rect x="124" y="40" width="52" height="30" rx="4" fill="#10b981"/>
      <rect x="184" y="40" width="52" height="30" rx="4" fill="#3b82f6"/>
      <rect x="64" y="78" width="52" height="30" rx="4" fill="#8b5cf6"/>
      <rect x="124" y="78" width="52" height="30" rx="4" fill="#f59e0b"/>
      <rect x="184" y="115" width="52" height="30" rx="4" fill="#06b6d4"/>
    </g>
  </g>
</svg>
